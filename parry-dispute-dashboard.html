<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Parry — Dispute Coach</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');

  :root{
    --ink:#10151f;
    --slate-900:#1b2433;
    --slate-700:#3a4659;
    --slate-400:#7b8aa1;
    --paper:#eef0f4;
    --paper-2:#ffffff;
    --line:#dde1e8;
    --cobalt:#2f4ff0;
    --cobalt-soft:#e7ebff;
    --amber:#e69a1f;
    --amber-soft:#fdf1dd;
    --coral:#e25b4f;
    --coral-soft:#fbe9e7;
    --sage:#2f8f63;
    --sage-soft:#e6f3ec;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'IBM Plex Sans', sans-serif;
    background:var(--paper);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  .app{
    display:grid;
    grid-template-columns: 360px 1fr;
    min-height:600px;
    max-width:1280px;
    margin:0 auto;
  }

  /* ---- LEFT: case list ---- */
  .list-pane{
    background:var(--paper-2);
    border-right:1px solid var(--line);
    display:flex;
    flex-direction:column;
  }
  .list-header{
    padding:24px 16px 16px;
    border-bottom:1px solid var(--line);
  }
  .brand-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:18px;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:8px;
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size:18px;
    color:var(--ink);
  }
  .bell-wrap{ position:relative; }
  .bell-btn{
    background:none; border:none; cursor:pointer;
    width:32px; height:32px; border-radius:8px;
    display:flex; align-items:center; justify-content:center;
    position:relative; color:var(--slate-700);
  }
  .bell-btn:hover{ background:var(--paper); }
  .bell-btn svg{ width:18px; height:18px; }
  .bell-badge{
    position:absolute; top:2px; right:2px;
    min-width:16px; height:16px; border-radius:8px;
    background:var(--coral); color:#fff;
    font-size:10px; font-weight:700;
    display:flex; align-items:center; justify-content:center;
    padding:0 3px;
  }
  .bell-badge.hidden{ display:none; }
  .notif-dropdown{
    position:absolute; top:40px; right:0;
    width:300px;
    background:var(--paper-2);
    border:1px solid var(--line);
    border-radius:12px;
    box-shadow:0 8px 24px rgba(16,21,31,.12);
    z-index:30;
    display:none;
    overflow:hidden;
  }
  .notif-dropdown.open{ display:block; }
  .notif-head{
    font-size:12.5px; font-weight:600; color:var(--slate-700);
    padding:12px 16px; border-bottom:1px solid var(--line);
  }
  .notif-item{
    position:relative;
    display:flex; flex-direction:column; gap:2px;
    padding:12px 16px 12px 28px; cursor:pointer;
    border-bottom:1px solid var(--line);
  }
  .notif-item:last-child{ border-bottom:none; }
  .notif-item:hover{ background:var(--paper); }
  .notif-item.unread .notif-text{ font-weight:600; }
  .notif-dot{
    position:absolute; left:14px; top:16px;
    width:6px; height:6px; border-radius:50%;
    background:var(--cobalt);
  }
  .notif-text{ font-size:13px; color:var(--ink); line-height:1.4; }
  .notif-time{ font-size:11.5px; color:var(--slate-400); }
  .notif-empty{ padding:20px 16px; text-align:center; font-size:13px; color:var(--slate-400); }
  .brand-mark{
    width:22px;height:22px;
    border-radius:5px;
    background:var(--ink);
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
  }
  .brand-mark svg{ width:12px; height:12px; }
  .list-title{
    font-family:'Space Grotesk', sans-serif;
    font-weight:600;
    font-size:13px;
    letter-spacing:.03em;
    text-transform:uppercase;
    color:var(--slate-400);
  }
  .filter-tabs{
    display:flex;
    gap:4px;
    flex-wrap:nowrap;
    overflow-x:auto;
    scrollbar-width:none;
  }
  .filter-tabs::-webkit-scrollbar{ display:none; }
  .filter-tab{
    font-family:'IBM Plex Sans', sans-serif;
    font-size:12px;
    font-weight:600;
    padding:5px 9px;
    border-radius:14px;
    border:none;
    background:transparent;
    color:var(--slate-400);
    cursor:pointer;
    white-space:nowrap;
    flex-shrink:0;
  }
  .filter-tab.active{ background:var(--paper); color:var(--ink); }
  .case-list{
    flex:1;
    overflow-y:auto;
    padding:8px;
  }
  .case-card{
    display:flex;
    gap:10px;
    align-items:center;
    padding:12px;
    border-radius:10px;
    cursor:pointer;
    border:1px solid transparent;
    margin-bottom:4px;
    transition:background .15s ease;
  }
  .case-card:hover{ background:var(--paper); }
  .case-card.active{
    background:var(--cobalt-soft);
    border-color:#c7d2fb;
  }
  .case-card.resolved-row{ opacity:.6; }

  .ring{
    position:relative;
    width:36px;height:36px;
    flex-shrink:0;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .ring svg{ position:absolute; inset:0; transform:rotate(-90deg); }

  .case-days{
    font-family:'IBM Plex Mono', monospace;
    font-size:13px;
    font-weight:600;
    flex-shrink:0;
  }
  .tx-calm{ color:var(--cobalt); }
  .tx-warning{ color:var(--amber); }
  .tx-critical{ color:var(--coral); }
  .tx-resolved{ color:var(--sage); }
  .tx-submitted{ color:var(--cobalt); }

  .modal-backdrop{
    position:fixed; inset:0;
    background:rgba(16,21,31,.5);
    display:flex; align-items:center; justify-content:center;
    padding:20px;
    z-index:50;
  }
  .modal-card{
    background:var(--paper-2);
    border-radius:16px;
    width:100%; max-width:520px;
    max-height:88vh;
    display:flex; flex-direction:column;
    overflow:hidden;
  }
  .modal-head{
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 20px 0;
  }
  .modal-steps{ display:flex; gap:6px; }
  .step-dot{ width:22px; height:4px; border-radius:2px; background:var(--line); }
  .step-dot.active{ background:var(--cobalt); }
  .step-dot.done{ background:var(--slate-400); }
  .modal-close{
    background:none; border:none; cursor:pointer;
    font-size:20px; color:var(--slate-400); line-height:1;
    padding:0 4px;
  }
  .modal-body{ padding:20px 24px; overflow-y:auto; }
  .modal-title{
    font-family:'Space Grotesk', sans-serif;
    font-weight:600; font-size:20px; color:var(--ink);
    margin:8px 0 6px;
  }
  .modal-sub{ font-size:13.5px; color:var(--slate-700); margin:0 0 16px; line-height:1.5; }
  .modal-note{ font-size:12.5px; color:var(--slate-400); margin:12px 0 0; }
  .letter-textarea{
    width:100%; min-height:220px;
    font-family:'IBM Plex Sans', sans-serif;
    font-size:14.5px; line-height:1.6; color:var(--ink);
    border:1px solid var(--line); border-radius:10px;
    padding:14px; resize:vertical;
  }
  .summary-row{
    display:flex; justify-content:space-between;
    font-size:14px; padding:10px 0;
    border-bottom:1px solid var(--line);
  }
  .summary-row:last-child{ border-bottom:none; }
  .summary-row span:first-child{ color:var(--slate-400); }
  .summary-row span:last-child{ color:var(--ink); font-weight:600; }
  .success-icon{
    width:48px; height:48px; border-radius:50%;
    background:var(--sage-soft); color:var(--sage);
    display:flex; align-items:center; justify-content:center;
    font-size:22px; margin:4px 0 16px;
  }
  .modal-footer{
    display:flex; justify-content:flex-end; gap:10px;
    padding:16px 24px; border-top:1px solid var(--line);
  }

  .case-info{ flex:1; min-width:0; }
  .case-title{
    font-size:14px;
    font-weight:600;
    color:var(--ink);
    margin-bottom:2px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .case-sub{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    color:var(--slate-400);
  }
  .case-amount{
    font-family:'IBM Plex Mono', monospace;
    font-size:12.5px;
    color:var(--slate-400);
    flex-shrink:0;
    min-width:44px;
    white-space:nowrap;
    text-align:right;
  }

  /* ---- RIGHT: detail panel ---- */
  .detail-pane{
    padding:32px 40px 40px;
    overflow-y:auto;
  }
  .empty-state{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    height:100%; min-height:440px;
    text-align:center;
  }
  .empty-title{ margin:14px 0 4px; font-size:15px; font-weight:600; color:var(--slate-700); }
  .empty-sub{ margin:0; font-size:13.5px; color:var(--slate-400); max-width:260px; line-height:1.6; }
  .detail-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:28px;
    gap:24px;
  }
  .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    color:var(--slate-400);
    letter-spacing:.04em;
    margin-bottom:6px;
  }
  .detail-title{
    font-family:'Space Grotesk', sans-serif;
    font-weight:600;
    font-size:26px;
    color:var(--ink);
    margin:0 0 8px;
  }
  .detail-meta{
    display:flex;
    gap:18px;
    font-size:13.5px;
    color:var(--slate-700);
  }
  .detail-meta strong{ color:var(--ink); font-weight:600; }

  .deadline-block{
    flex-shrink:0;
  }
  .deadline-badge{
    display:inline-flex;
    align-items:center;
    font-family:'IBM Plex Sans', sans-serif;
    font-weight:600;
    font-size:14px;
    padding:9px 18px;
    border-radius:20px;
    white-space:nowrap;
  }
  .bg-calm{ background:var(--cobalt-soft); color:var(--cobalt); }
  .bg-warning{ background:var(--amber-soft); color:var(--amber); }
  .bg-critical{ background:var(--coral-soft); color:var(--coral); }
  .bg-resolved{ background:var(--sage-soft); color:var(--sage); }
  .bg-submitted{ background:var(--cobalt-soft); color:var(--cobalt); }

  .panel{
    background:var(--paper-2);
    border:1px solid var(--line);
    border-radius:14px;
    padding:22px 24px;
    margin-bottom:18px;
  }
  .panel-label{
    font-family:'IBM Plex Mono', monospace;
    font-size:11.5px;
    text-transform:uppercase;
    letter-spacing:.05em;
    color:var(--cobalt);
    margin-bottom:10px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .panel-label .dot{
    width:6px;height:6px;border-radius:50%;background:var(--cobalt);
  }

  .explanation{
    font-size:16px;
    line-height:1.55;
    color:var(--slate-900);
  }
  .explanation b{ color:var(--ink); }

  #whatHappenedContent{ transition: opacity .35s ease; }
  #strengthRow{ transition: opacity .35s ease; }
  .pulse-label{
    font-size:16px; line-height:1.55; color:var(--slate-400);
    display:flex; align-items:center; gap:8px;
  }
  .dot-pulse{
    width:6px; height:6px; border-radius:50%;
    background:var(--cobalt); display:inline-block;
    animation:dotPulse 1s infinite ease-in-out;
  }
  @keyframes dotPulse{ 0%,100%{ opacity:.3; } 50%{ opacity:1; } }

  .strength-row{
    display:flex;
    align-items:center;
    gap:14px;
    margin-top:18px;
    padding-top:18px;
    border-top:1px solid var(--line);
  }
  .strength-tag{
    font-size:13px;
    font-weight:600;
    padding:6px 12px;
    border-radius:20px;
  }
  .strength-tag.strong{ background:var(--sage-soft); color:var(--sage); }
  .strength-tag.moderate{ background:var(--amber-soft); color:var(--amber); }
  .strength-tag.weak{ background:var(--coral-soft); color:var(--coral); }
  .strength-note{ font-size:13.5px; color:var(--slate-700); }

  .checklist{ list-style:none; margin:0; padding:0; }
  .check-item{
    display:flex;
    align-items:flex-start;
    gap:12px;
    padding:14px 0;
    border-bottom:1px solid var(--line);
  }
  .check-item:last-child{ border-bottom:none; }
  .check-icon{
    width:22px;height:22px;
    border-radius:50%;
    flex-shrink:0;
    margin-top:1px;
    display:flex;align-items:center;justify-content:center;
    font-size:13px;
  }
  .check-icon.have{ background:var(--sage-soft); color:var(--sage); }
  .check-icon.missing{ background:var(--coral-soft); color:var(--coral); }
  .check-text{ flex:1; }
  .check-text strong{ display:block; font-size:14px; color:var(--ink); margin-bottom:2px; }
  .check-text span{ font-size:13px; color:var(--slate-400); }
  .added-tag{
    font-size:11px; font-weight:600;
    color:var(--cobalt); background:var(--cobalt-soft);
    padding:2px 6px; border-radius:8px;
    margin-left:6px; vertical-align:middle;
  }
  .add-evidence-link{
    background:none; border:none;
    color:var(--cobalt); font-size:12.5px; font-weight:600;
    cursor:pointer; white-space:nowrap; flex-shrink:0; padding:0;
  }
  .add-evidence-link.icon-only{
    width:22px; height:22px;
    border-radius:50%;
    background:var(--cobalt-soft);
    display:flex; align-items:center; justify-content:center;
    font-size:15px;
    margin-top:1px;
  }
  .add-evidence-generic{ margin-top:14px; }
  .add-evidence-form{ margin-top:14px; padding-top:14px; border-top:1px solid var(--line); }
  .add-evidence-form textarea{
    width:100%; min-height:70px;
    font-family:'IBM Plex Sans', sans-serif; font-size:13.5px;
    border:1px solid var(--line); border-radius:8px;
    padding:10px; resize:vertical;
  }
  .add-evidence-actions{ display:flex; align-items:center; gap:8px; margin-top:10px; }
  .form-spacer{ flex:1; }
  .btn-chip{
    background:var(--paper); border:1px solid var(--line);
    border-radius:8px; padding:7px 12px;
    font-size:12.5px; font-weight:600; color:var(--slate-700);
    cursor:pointer;
  }
  .btn-chip.attached{ background:var(--sage-soft); color:var(--sage); border-color:transparent; }

  .toast{
    position:fixed; bottom:24px; left:50%;
    transform:translateX(-50%) translateY(10px);
    background:var(--ink); color:#fff;
    font-size:13.5px; font-weight:500;
    padding:10px 18px; border-radius:10px;
    opacity:0; transition:opacity .25s ease, transform .25s ease;
    z-index:100; pointer-events:none; white-space:nowrap;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  .list-empty{
    padding:48px 20px; text-align:center;
    color:var(--slate-400); font-size:13.5px; line-height:1.6;
  }

  .actions{
    display:flex;
    gap:10px;
    margin-top:8px;
  }
  .btn{
    font-family:'IBM Plex Sans', sans-serif;
    font-weight:600;
    font-size:14px;
    padding:11px 20px;
    border-radius:9px;
    border:none;
    cursor:pointer;
  }
  .btn-primary{ background:var(--ink); color:#fff; }
  .btn-secondary{ background:transparent; color:var(--slate-700); border:1px solid var(--line); }

  @media (max-width:780px){
    .app{ grid-template-columns:1fr; }
    .list-pane{ border-right:none; border-bottom:1px solid var(--line); max-height:340px; }

    .detail-pane{ padding:24px 20px 28px; }
    .detail-top{ flex-direction:column; align-items:flex-start; gap:14px; }
    .detail-meta{ flex-wrap:wrap; gap:8px 16px; }

    .actions{ flex-wrap:wrap; }
    .actions .btn{ flex:1; min-width:140px; text-align:center; }

    .modal-footer{ flex-wrap:wrap; }
    .modal-footer .btn{ flex:1; min-width:120px; }

    .add-evidence-actions{ flex-wrap:wrap; }
    .form-spacer{ flex-basis:100%; height:0; }

    .notif-dropdown{ width:min(300px, calc(100vw - 32px)); }

    .toast{
      white-space:normal;
      max-width:calc(100vw - 40px);
      text-align:center;
    }
  }
</style>
</head>
<body>

<div class="app">

  <!-- LEFT: case list -->
  <div class="list-pane">
    <div class="list-header">
      <div class="brand-row">
        <div class="brand"><span class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="#e7ebff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg></span> Parry</div>
        <div class="bell-wrap">
          <button class="bell-btn" id="bellBtn" aria-label="Notifications">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 2a6 6 0 0 0-6 6v3.5c0 .9-.36 1.76-1 2.4L4 15h16l-1-1.1c-.64-.64-1-1.5-1-2.4V8a6 6 0 0 0-6-6z"/><path d="M9.5 18a2.5 2.5 0 0 0 5 0"/></svg>
            <span class="bell-badge hidden" id="bellBadge"></span>
          </button>
          <div class="notif-dropdown" id="notifDropdown"></div>
        </div>
      </div>
      <div class="filter-tabs" id="filterTabs"></div>
    </div>
    <div class="case-list" id="caseList"></div>
  </div>

  <!-- RIGHT: detail -->
  <div class="detail-pane" id="detailPane"></div>

</div>

<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script>
const cases = [
  {
    id: "DSP-2291",
    title: "Item not received",
    sub: "Heavyweight Hoodie · Charcoal",
    customer: "J. Alvarez",
    amount: 89,
    daysLeft: 6,
    totalDays: 20,
    reasonCode: "Visa 13.1",
    explanation: "Customer says it never arrived. Code 13.1 — Item Not Received. This needs proof of delivery, not proof of shipment.",
    strength: "strong",
    strengthNote: "You have everything this code requires. The most common mistake on 13.1 disputes is submitting a shipping receipt instead of a delivery confirmation — yours shows both.",
    checklist: [
      { have:true, title:"Delivery confirmation", note:"Signed for at customer's address, 3 days after order" },
      { have:true, title:"Tracking number on file", note:"Matches the carrier's delivery record" },
      { have:true, title:"Order confirmation email", note:"Sent to customer at checkout" },
      { have:false, title:"Customer communication log", note:"No record of the customer contacting support before filing — optional, but strengthens your case" }
    ],
    recommendation: "fight",
    draftLetter: "This is a response to dispute DSP-2291, filed under Visa reason code 13.1 (Merchandise/Services Not Received).\n\nThe order was delivered to the cardholder's address on file. Attached is a signed delivery confirmation, the carrier tracking number, and the original order confirmation sent to the customer at checkout.\n\nBased on this evidence, we request this dispute be resolved in the merchant's favor."
  },
  {
    id: "DSP-2304",
    title: "Transaction not recognized",
    sub: "Retro Runner Sneaker · Sz 10",
    customer: "T. Okafor",
    amount: 240,
    daysLeft: 2,
    totalDays: 45,
    reasonCode: "Mastercard 4837",
    explanation: "Cardholder says they didn't make this purchase. Code 4837 — fraud claim. This needs proof the cardholder authorized it, not just that the order was fulfilled correctly.",
    strength: "moderate",
    strengthNote: "Your device match is solid, but a prior-purchase history would strengthen it further. First-time fraud claims without that history are harder to resolve cleanly — worth pulling before the deadline.",
    checklist: [
      { have:true, title:"IP & device match", note:"Matches the device used on 2 prior undisputed orders" },
      { have:true, title:"AVS & CVV match", note:"Billing address and card code both verified at checkout" },
      { have:false, title:"Prior purchase history", note:"Only 2 days left — pull this before the deadline if you can" },
      { have:false, title:"3D Secure authentication log", note:"Not enabled at checkout for this order" }
    ],
    recommendation: "fight-flag",
    draftLetter: "This is a response to dispute DSP-2304, filed under Mastercard reason code 4837 (fraudulent transaction).\n\nThe transaction was placed using the same device and IP address as two prior, undisputed purchases on this account. The billing address and card security code were both verified at checkout.\n\nWe request this dispute be reviewed in light of this evidence."
  },
  {
    id: "DSP-2266",
    title: "Duplicate charge",
    sub: "Canvas Tote Bag",
    customer: "M. Reyes",
    amount: 45,
    daysLeft: 0,
    totalDays: 20,
    reasonCode: "Visa 12.6.1",
    explanation: "Customer was charged twice due to a checkout retry. The refund record predates the dispute, so it was resolved automatically.",
    strength: "strong",
    strengthNote: "Resolved on first submission. No further action needed.",
    checklist: [
      { have:true, title:"Refund record", note:"Processed 4 days before the dispute was filed" },
      { have:true, title:"Transaction log", note:"Shows both charges and the matching refund" }
    ],
    recommendation: "won"
  }
];

let activeId = null;
let hasSelected = false;
let notifDropdownOpen = false;
let notifIdCounter = 3;
const notifications = [
  { id:'n1', caseId:'DSP-2291', type:'filed', time:'2m ago', read:false },
  { id:'n2', caseId:'DSP-2304', type:'filed', time:'1h ago', read:false },
  { id:'n3', caseId:'DSP-2266', type:'resolved', time:'2d ago', read:true }
];
let activeFilter = 'all';
let modalCaseId = null;
let modalStep = 1;
let modalLetterText = '';
let modalViewMode = null;
let addFormOpen = false;
let addFormTarget = null;
let addFormText = '';
let addFormFileAttached = false;
const analyzedCases = new Set();

function bumpStrength(c){
  const ladder = ['weak', 'moderate', 'strong'];
  const idx = ladder.indexOf(c.strength);
  if (idx > -1 && idx < ladder.length - 1) c.strength = ladder[idx + 1];
}

function prefersReducedMotion(){
  return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
}

function showToast(message){
  const root = document.getElementById('toastRoot');
  root.innerHTML = `<div class="toast" id="activeToast">${message}</div>`;
  requestAnimationFrame(() => {
    document.getElementById('activeToast')?.classList.add('show');
  });
  setTimeout(() => {
    document.getElementById('activeToast')?.classList.remove('show');
    setTimeout(() => { root.innerHTML = ''; }, 300);
  }, 2600);
}

function ringSvg(daysLeft, totalDays, size, stroke, override){
  const full = override === 'resolved' || override === 'submitted' || daysLeft <= 0;
  const pct = full ? 1 : Math.max(0, Math.min(1, daysLeft / totalDays));
  const r = (size - stroke) / 2;
  const c = 2 * Math.PI * r;
  const offset = c * (1 - pct);
  let color = "var(--cobalt)";
  if (override === 'submitted') color = "var(--cobalt)";
  else if (override === 'resolved' || daysLeft <= 0) color = "var(--sage)";
  else if (pct <= 0.15) color = "var(--coral)";
  else if (pct <= 0.4) color = "var(--amber)";
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--line)" stroke-width="${stroke}"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}"
      stroke-dasharray="${c}" stroke-dashoffset="${offset}" stroke-linecap="round"/>
  </svg>`;
}

function tierRank(tier){
  return { critical:0, warning:1, calm:2, submitted:3, resolved:4 }[tier];
}

function displayTier(c){
  if (c.submitted) return 'submitted';
  return urgencyTier(c.daysLeft, c.totalDays);
}

function urgencyTier(daysLeft, totalDays){
  if (daysLeft <= 0) return 'resolved';
  const pct = daysLeft / totalDays;
  if (pct <= 0.15) return 'critical';
  if (pct <= 0.4) return 'warning';
  return 'calm';
}

function getFilteredCases(){
  if (activeFilter === 'open') return cases.filter(c => c.recommendation !== 'won' && !c.submitted);
  if (activeFilter === 'submitted') return cases.filter(c => c.submitted);
  if (activeFilter === 'resolved') return cases.filter(c => c.recommendation === 'won');
  return cases;
}

function getSortedCases(list){
  return [...list].sort((a,b) => {
    const ra = tierRank(displayTier(a));
    const rb = tierRank(displayTier(b));
    if (ra !== rb) return ra - rb;
    return a.daysLeft - b.daysLeft;
  });
}

function renderTabs(){
  const total = cases.length;
  const resolvedCount = cases.filter(c => c.recommendation === 'won').length;
  const submittedCount = cases.filter(c => c.submitted).length;
  const openCount = total - resolvedCount - submittedCount;
  const tabs = [
    { key:'all', label:'All', count: total },
    { key:'open', label:'Needs response', count: openCount },
    { key:'submitted', label:'Submitted', count: submittedCount },
    { key:'resolved', label:'Resolved', count: resolvedCount }
  ];
  document.getElementById('filterTabs').innerHTML = tabs.map(t => `
    <button class="filter-tab ${activeFilter===t.key?'active':''}" data-key="${t.key}">${t.label} ${t.count}</button>
  `).join('');
  document.querySelectorAll('.filter-tab').forEach(btn => {
    btn.addEventListener('click', () => { activeFilter = btn.dataset.key; renderAll(); });
  });
}

function emptyListMessage(filter){
  if (filter === 'open') return "You're all caught up — no disputes need a response.";
  if (filter === 'submitted') return 'Nothing submitted yet.';
  if (filter === 'resolved') return 'No resolved cases yet.';
  return 'No disputes to show.';
}

function renderList(){
  const visible = getSortedCases(getFilteredCases());
  if (hasSelected && visible.length && !visible.some(c => c.id === activeId)){
    activeId = visible[0].id;
  }

  const list = document.getElementById('caseList');

  if (visible.length === 0){
    list.innerHTML = `<div class="list-empty">${emptyListMessage(activeFilter)}</div>`;
    return;
  }
  list.innerHTML = visible.map(c => {
    const tier = displayTier(c);
    const won = c.recommendation === 'won';
    const inactive = won || c.submitted;
    const dayLabel = c.submitted ? 'Sent' : tier === 'resolved' ? 'Resolved' : `${c.daysLeft}d`;
    const ringOverride = won ? 'resolved' : c.submitted ? 'submitted' : undefined;
    return `
    <div class="case-card ${c.id===activeId?'active':''} ${inactive?'resolved-row':''}" data-id="${c.id}">
      <div class="ring">
        ${ringSvg(c.daysLeft, c.totalDays, 36, 3, ringOverride)}
      </div>
      <div class="case-info">
        <div class="case-title">${c.title}</div>
        <div class="case-sub">${c.reasonCode}</div>
      </div>
      <span class="case-days tx-${tier}">${dayLabel}</span>
      <div class="case-amount">$${c.amount.toLocaleString()}</div>
    </div>
  `;
  }).join('');
  list.querySelectorAll('.case-card').forEach(el=>{
    el.addEventListener('click', ()=>{
      activeId = el.dataset.id;
      hasSelected = true;
      addFormOpen = false; addFormTarget = null; addFormText = ''; addFormFileAttached = false;
      renderAll();
    });
  });
}

function playStrengthReassessment(caseId){
  const targetId = caseId;
  const c0 = cases.find(x => x.id === targetId);
  if (!c0) return;

  if (prefersReducedMotion()){
    bumpStrength(c0);
    c0.strengthNote = "Updated after you added new evidence — this strengthens your case.";
    addNotification(c0.id, 'reassessed');
    if (activeId === targetId) renderDetail();
    return;
  }

  const row = document.getElementById('strengthRow');
  if (!row) return;
  row.style.opacity = '0';
  setTimeout(() => {
    if (activeId !== targetId) return;
    const row2 = document.getElementById('strengthRow');
    if (!row2) return;
    row2.innerHTML = `<span class="pulse-label" style="font-size:13.5px;">Reassessing case strength <span class="dot-pulse"></span></span>`;
    row2.style.opacity = '1';
    setTimeout(() => {
      if (activeId !== targetId) return;
      const c = cases.find(x => x.id === targetId);
      if (!c) return;
      bumpStrength(c);
      c.strengthNote = "Updated after you added new evidence — this strengthens your case.";
      addNotification(c.id, 'reassessed');
      const row3 = document.getElementById('strengthRow');
      if (!row3) return;
      row3.style.opacity = '0';
      setTimeout(() => {
        if (activeId !== targetId) return;
        const row4 = document.getElementById('strengthRow');
        if (!row4) return;
        const sl2 = strengthLabel(c.strength);
        row4.innerHTML = `<span class="strength-tag ${sl2.cls}">${sl2.tag}</span><span class="strength-note">${c.strengthNote}</span>`;
        row4.style.opacity = '1';
      }, 350);
    }, 1800);
  }, 350);
}

function strengthLabel(s){
  if(s==='strong') return {tag:'Strong case', cls:'strong'};
  if(s==='moderate') return {tag:'Moderate case', cls:'moderate'};
  return {tag:'Weak case', cls:'weak'};
}

function renderDetail(){
  const c = cases.find(x=>x.id===activeId);
  if (!c){
    document.getElementById('detailPane').innerHTML = `
      <div class="empty-state">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="var(--slate-400)" stroke-width="1.5"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg>
        <p class="empty-title">Select a case</p>
        <p class="empty-sub">Choose a dispute from the list to see Parry's analysis and evidence checklist.</p>
      </div>
    `;
    return;
  }
  const sl = strengthLabel(c.strength);
  const won = c.recommendation === 'won';
  const firstView = !analyzedCases.has(c.id);
  if (firstView) analyzedCases.add(c.id);

  const realWhatHappened = `
    <div class="explanation">${c.explanation}</div>
    <div id="strengthRow" class="strength-row">
      <span class="strength-tag ${sl.cls}">${sl.tag}</span>
      <span class="strength-note">${c.strengthNote}</span>
    </div>
  `;
  const reduceMotion = prefersReducedMotion();
  const whatHappenedInner = (firstView && !reduceMotion)
    ? `<span class="pulse-label">Analyzing case <span class="dot-pulse"></span></span>`
    : realWhatHappened;

  const checklistHtml = c.checklist.map((item, idx) => `
    <li class="check-item">
      <span class="check-icon ${item.have?'have':'missing'}">${item.have?'✓':'!'}</span>
      <div class="check-text">
        <strong>${item.title}${item.addedByUser ? ' <span class="added-tag">Added by you</span>' : ''}</strong>
        <span>${item.note}</span>
      </div>
      ${!item.have ? `<button class="add-evidence-link icon-only" data-idx="${idx}" aria-label="Add evidence for ${item.title}">+</button>` : ''}
    </li>
  `).join('');

  const addFormHtml = addFormOpen ? `
    <div class="add-evidence-form">
      <textarea id="addEvidenceInput" placeholder="Describe what you're adding...">${addFormText}</textarea>
      <div class="add-evidence-actions">
        <button class="btn-chip ${addFormFileAttached?'attached':''}" id="attachFileBtn">${addFormFileAttached ? '✓ File attached' : 'Attach a file'}</button>
        <div class="form-spacer"></div>
        <button class="btn btn-secondary" id="cancelAddBtn">Cancel</button>
        <button class="btn btn-primary" id="saveAddBtn">Save evidence</button>
      </div>
    </div>
  ` : `<button class="add-evidence-link add-evidence-generic" id="addEvidenceGenericBtn">+ Add evidence</button>`;

  const badgeTier = won ? 'resolved' : c.submitted ? 'submitted' : urgencyTier(c.daysLeft, c.totalDays);
  const badgeText = won ? 'Resolved' : c.submitted ? 'Response submitted' : `${c.daysLeft} day${c.daysLeft===1?'':'s'} left to respond`;

  let actionsHtml = '';
  if (won) {
    actionsHtml = `<div class="actions"><button class="btn btn-secondary" id="viewEvidenceBtn">View submitted evidence</button></div>`;
  } else if (c.submitted) {
    actionsHtml = `<div class="actions"><button class="btn btn-secondary" id="viewLetterBtn">View submitted response</button></div>`;
  } else {
    actionsHtml = `<div class="actions">
      <button class="btn btn-primary" id="submitResponseBtn">Submit response</button>
      <button class="btn btn-secondary" id="requestTimeBtn">Request more time</button>
    </div>`;
  }

  document.getElementById('detailPane').innerHTML = `
    <div class="detail-top">
      <div>
        <div class="eyebrow">${c.id} · ${c.reasonCode}</div>
        <h1 class="detail-title">${c.title}</h1>
        <div class="detail-meta">
          <span><strong>$${c.amount.toLocaleString()}</strong></span>
          <span>${c.customer}</span>
          <span>${c.sub}</span>
        </div>
      </div>
      <div class="deadline-block">
        <span class="deadline-badge bg-${badgeTier}">${badgeText}</span>
      </div>
    </div>

    <div class="panel">
      <div class="panel-label"><span class="dot"></span>What happened</div>
      <div id="whatHappenedContent">${whatHappenedInner}</div>
    </div>

    <div class="panel">
      <div class="panel-label"><span class="dot"></span>Evidence on file</div>
      <ul class="checklist">${checklistHtml}</ul>
      ${addFormHtml}
    </div>

    ${actionsHtml}
  `;

  document.getElementById('submitResponseBtn')?.addEventListener('click', () => openModal(c.id));
  document.getElementById('viewLetterBtn')?.addEventListener('click', () => openModal(c.id, 'letter'));
  document.getElementById('viewEvidenceBtn')?.addEventListener('click', () => openModal(c.id, 'evidence'));
  document.getElementById('requestTimeBtn')?.addEventListener('click', () => {
    showToast(`Extension requested for ${c.id} — we'll notify you once the network responds.`);
  });

  if (firstView && !reduceMotion){
    const targetId = c.id;
    setTimeout(() => {
      if (activeId !== targetId) return;
      const el = document.getElementById('whatHappenedContent');
      if (!el) return;
      el.style.opacity = '0';
      setTimeout(() => {
        if (activeId !== targetId) return;
        const el2 = document.getElementById('whatHappenedContent');
        if (!el2) return;
        el2.innerHTML = realWhatHappened;
        el2.style.opacity = '1';
      }, 350);
    }, 2200);
  }

  document.querySelectorAll('.add-evidence-link[data-idx]').forEach(btn => {
    btn.addEventListener('click', () => {
      addFormOpen = true;
      addFormTarget = parseInt(btn.dataset.idx, 10);
      addFormText = c.checklist[addFormTarget].title;
      addFormFileAttached = false;
      renderDetail();
    });
  });
  document.getElementById('addEvidenceGenericBtn')?.addEventListener('click', () => {
    addFormOpen = true; addFormTarget = null; addFormText = ''; addFormFileAttached = false;
    renderDetail();
  });
  document.getElementById('cancelAddBtn')?.addEventListener('click', () => {
    addFormOpen = false; addFormTarget = null; addFormText = ''; addFormFileAttached = false;
    renderDetail();
  });
  document.getElementById('attachFileBtn')?.addEventListener('click', () => {
    addFormFileAttached = !addFormFileAttached;
    renderDetail();
  });
  document.getElementById('addEvidenceInput')?.addEventListener('input', (e) => {
    addFormText = e.target.value;
  });
  document.getElementById('saveAddBtn')?.addEventListener('click', () => {
    if (addFormTarget !== null) {
      const item = c.checklist[addFormTarget];
      item.have = true;
      item.addedByUser = true;
      item.note = addFormFileAttached ? `${addFormText} (file attached)` : addFormText;
    } else {
      c.checklist.push({
        have: true,
        title: addFormText || 'Additional evidence',
        note: addFormFileAttached ? 'Added by you (file attached)' : 'Added by you',
        addedByUser: true
      });
    }
    addFormOpen = false; addFormTarget = null; addFormText = ''; addFormFileAttached = false;
    renderAll();
    playStrengthReassessment(c.id);
  });
}

function openModal(caseId, viewMode){
  const c = cases.find(x => x.id === caseId);
  if (!c) return;
  modalCaseId = caseId;
  modalViewMode = viewMode || null;
  modalStep = viewMode === 'letter' ? 2 : 1;
  modalLetterText = c.draftLetter || '';
  renderModal();
}

function closeModal(){
  modalCaseId = null;
  document.getElementById('modalRoot').innerHTML = '';
  renderAll();
}

function step1Html(c, submittedView){
  const included = c.checklist.filter(i => i.have);
  const missing = c.checklist.filter(i => !i.have);
  const title = submittedView ? 'Submitted evidence' : 'Review evidence';
  const intro = submittedView
    ? `These items were included in the response for ${c.reasonCode}.`
    : `These items will be included in your response to ${c.reasonCode}.`;
  return `
    <h2 class="modal-title">${title}</h2>
    <p class="modal-sub">${intro}</p>
    <ul class="checklist">
      ${included.map(i => `<li class="check-item"><span class="check-icon have">✓</span><div class="check-text"><strong>${i.title}</strong><span>${i.note}</span></div></li>`).join('')}
    </ul>
    ${(!submittedView && missing.length) ? `<p class="modal-note">${missing.length} item${missing.length===1?'':'s'} marked missing won't be included. You can still submit without them.</p>` : ''}
  `;
}

function step2Html(c){
  if (modalViewMode === 'letter'){
    return `
      <h2 class="modal-title">Submitted response</h2>
      <p class="modal-sub">This is the response that was sent for ${c.id}.</p>
      <div class="letter-textarea" style="white-space:pre-wrap; background:var(--paper);">${modalLetterText}</div>
    `;
  }
  return `
    <h2 class="modal-title">AI-drafted response</h2>
    <p class="modal-sub">Edit anything before sending — this is a starting point, not a final answer.</p>
    <textarea id="letterTextarea" class="letter-textarea">${modalLetterText}</textarea>
  `;
}

function step3Html(c){
  return `
    <h2 class="modal-title">Confirm &amp; submit</h2>
    <p class="modal-sub">Your response will be submitted directly to the card network for this case.</p>
    <div class="summary-row"><span>Case</span><span>${c.id}</span></div>
    <div class="summary-row"><span>Amount</span><span>$${c.amount.toLocaleString()}</span></div>
    <div class="summary-row"><span>Deadline</span><span>${c.daysLeft} day${c.daysLeft===1?'':'s'} left</span></div>
  `;
}

function step4Html(c){
  return `
    <div class="success-icon">✓</div>
    <h2 class="modal-title">Response submitted</h2>
    <p class="modal-sub">Your response for ${c.id} has been sent. Most networks reply within 7–10 business days — we'll update this case automatically when a decision comes back.</p>
  `;
}

function footerHtml(){
  if (modalViewMode) return `<button class="btn btn-primary" id="modalPrimaryBtn">Close</button>`;
  if (modalStep === 1) return `<button class="btn btn-secondary" id="modalSecondaryBtn">Cancel</button><button class="btn btn-primary" id="modalPrimaryBtn">Draft response</button>`;
  if (modalStep === 2) return `<button class="btn btn-secondary" id="modalSecondaryBtn">Back</button><button class="btn btn-primary" id="modalPrimaryBtn">Review &amp; submit</button>`;
  if (modalStep === 3) return `<button class="btn btn-secondary" id="modalSecondaryBtn">Back</button><button class="btn btn-primary" id="modalPrimaryBtn">Submit to network</button>`;
  return `<button class="btn btn-primary" id="modalPrimaryBtn" style="width:100%;">Done</button>`;
}

function renderModal(){
  const root = document.getElementById('modalRoot');
  const c = cases.find(x => x.id === modalCaseId);
  if (!c){ root.innerHTML = ''; return; }

  let body;
  if (modalViewMode === 'evidence') body = step1Html(c, true);
  else if (modalStep === 1) body = step1Html(c, false);
  else if (modalStep === 2) body = step2Html(c);
  else if (modalStep === 3) body = step3Html(c);
  else body = step4Html(c);

  const showDots = !modalViewMode;

  root.innerHTML = `
    <div class="modal-backdrop" id="modalBackdrop">
      <div class="modal-card">
        <div class="modal-head">
          ${showDots ? `<div class="modal-steps">${[1,2,3,4].map(n => `<span class="step-dot ${n===modalStep?'active':''} ${n<modalStep?'done':''}"></span>`).join('')}</div>` : `<div></div>`}
          ${modalStep < 4 ? `<button class="modal-close" id="modalCloseBtn" aria-label="Close">&times;</button>` : ''}
        </div>
        <div class="modal-body">${body}</div>
        <div class="modal-footer">${footerHtml()}</div>
      </div>
    </div>
  `;

  document.getElementById('modalBackdrop')?.addEventListener('click', (e) => {
    if (e.target.id === 'modalBackdrop') closeModal();
  });
  document.getElementById('modalCloseBtn')?.addEventListener('click', closeModal);

  document.getElementById('letterTextarea')?.addEventListener('input', (e) => {
    modalLetterText = e.target.value;
  });

  document.getElementById('modalSecondaryBtn')?.addEventListener('click', () => {
    if (modalStep === 1) closeModal();
    else { modalStep -= 1; renderModal(); }
  });

  document.getElementById('modalPrimaryBtn')?.addEventListener('click', () => {
    if (modalViewMode){ closeModal(); return; }
    if (modalStep < 3){ modalStep += 1; renderModal(); }
    else if (modalStep === 3){
      c.submitted = true;
      c.draftLetter = modalLetterText;
      modalStep = 4;
      addNotification(c.id, 'submitted');
      renderModal();
    } else {
      closeModal();
    }
  });
}

function productName(c){
  return c.sub.split('·')[0].trim();
}

function buildNotifText(n){
  const c = cases.find(x => x.id === n.caseId);
  if (!c) return '';
  if (n.type === 'filed') return `New dispute filed — ${productName(c)} ($${c.amount.toLocaleString()})`;
  if (n.type === 'resolved') return `Dispute resolved — ${productName(c)} ($${c.amount.toLocaleString()})`;
  if (n.type === 'submitted') return `Response submitted — ${productName(c)} ($${c.amount.toLocaleString()})`;
  if (n.type === 'reassessed'){
    const sl = strengthLabel(c.strength);
    return `${productName(c)} is now a ${sl.tag.toLowerCase()}`;
  }
  return '';
}

function addNotification(caseId, type){
  notifIdCounter += 1;
  notifications.unshift({ id: 'n' + notifIdCounter, caseId, type, time: 'Just now', read: false });
  renderBell();
}

function renderBell(){
  const unreadCount = notifications.filter(n => !n.read).length;
  const badge = document.getElementById('bellBadge');
  if (badge){
    badge.textContent = unreadCount;
    badge.classList.toggle('hidden', unreadCount === 0);
  }
  const dropdown = document.getElementById('notifDropdown');
  if (!dropdown) return;
  dropdown.classList.toggle('open', notifDropdownOpen);
  if (!notifDropdownOpen) return;

  dropdown.innerHTML = `
    <div class="notif-head">Notifications</div>
    ${notifications.length ? notifications.map(n => `
      <div class="notif-item ${n.read?'':'unread'}" data-id="${n.id}">
        ${!n.read ? '<span class="notif-dot"></span>' : ''}
        <span class="notif-text">${buildNotifText(n)}</span>
        <span class="notif-time">${n.time}</span>
      </div>
    `).join('') : `<div class="notif-empty">No notifications yet.</div>`}
  `;
  dropdown.querySelectorAll('.notif-item').forEach(el => {
    el.addEventListener('click', () => {
      const n = notifications.find(x => x.id === el.dataset.id);
      if (n){
        n.read = true;
        if (n.caseId){
          activeId = n.caseId;
          hasSelected = true;
          addFormOpen = false; addFormTarget = null; addFormText = ''; addFormFileAttached = false;
        }
      }
      notifDropdownOpen = false;
      renderAll();
    });
  });
}

document.getElementById('bellBtn').addEventListener('click', (e) => {
  e.stopPropagation();
  notifDropdownOpen = !notifDropdownOpen;
  renderBell();
});
document.addEventListener('click', (e) => {
  if (!notifDropdownOpen) return;
  const wrap = document.querySelector('.bell-wrap');
  if (wrap && !wrap.contains(e.target)){
    notifDropdownOpen = false;
    renderBell();
  }
});

function renderAll(){ renderTabs(); renderList(); renderDetail(); renderBell(); }
renderAll();
</script>

</body>
</html>
